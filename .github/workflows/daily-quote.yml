name: Daily Coding Quote

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Quote
        run: |
          quotes=(
          "First, solve the problem. Then, write the code."
          "Talk is cheap. Show me the code."
          "Code is like humor. When you have to explain it, it's bad."
          "Programs must be written for people to read."
          "Fix the cause, not the symptom."
          "Simplicity is the soul of efficiency."
          "Experience is the name everyone gives to their mistakes."
          "Make it work. Make it right. Make it fast."
          "Stay curious. Keep building."
          "Every bug is an opportunity to learn."
          "Dream. Code. Build. Repeat."
          "Consistency beats motivation."
          )

          DAY=$(date +%j)
          INDEX=$((DAY % ${#quotes[@]}))
          QUOTE="${quotes[$INDEX]}"

          if grep -q "<!--QUOTE_START-->" README.md; then
            perl -0777 -i -pe "s|<!--QUOTE_START-->.*?<!--QUOTE_END-->|<!--QUOTE_START-->\n> 💡 $QUOTE\n<!--QUOTE_END-->|s" README.md
          else
            echo "" >> README.md
            echo "## 💡 Today's Coding Wisdom" >> README.md
            echo "<!--QUOTE_START-->" >> README.md
            echo "> 💡 $QUOTE" >> README.md
            echo "<!--QUOTE_END-->" >> README.md
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet && exit 0

          git commit -m "💡 Daily Quote"

      - name: Push
        run: git push
